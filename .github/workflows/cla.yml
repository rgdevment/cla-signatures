name: CLA

# Called from each repository's own workflow on pull_request_target and issue_comment. It reads
# the pull request through the API and never checks it out, so nothing a contributor wrote runs
# with the token that writes the signatures.
on:
  workflow_call:
    inputs:
      project:
        description: Folder under signatures/ whose v1/cla.json holds this repository's signatures.
        type: string
        required: true
      document-url:
        description: The CLA a contributor is asked to read.
        type: string
        required: true
      allowlist:
        description: Logins that never sign, comma separated; a * matches anything.
        type: string
        default: rgdevment,dependabot[bot],github-actions[bot]
      sign-phrase:
        description: The exact comment that signs.
        type: string
        default: I have read the CLA Document and I hereby sign the CLA
      not-signed-message:
        description: What the pull request is told before the phrase and the list of who has not signed.
        type: string
        default: >-
          Thanks for the pull request. Every author and co-author has to sign the CLA before it can
          be merged; you keep the copyright on your work. To sign, post a comment on this pull
          request with exactly:
      all-signed-message:
        type: string
        default: All contributors have signed the CLA. Thanks!
    secrets:
      signatures-token:
        description: Fine-grained token with contents write on rgdevment/cla-signatures and nothing else.
        required: true

permissions: {}

jobs:
  signature:
    name: signature
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: write
    steps:
      - id: cla
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNATURES_TOKEN: ${{ secrets.signatures-token }}
          SIGNATURES_REPOSITORY: rgdevment/cla-signatures
          PROJECT: ${{ inputs.project }}
          DOCUMENT_URL: ${{ inputs.document-url }}
          ALLOWLIST: ${{ inputs.allowlist }}
          SIGN_PHRASE: ${{ inputs.sign-phrase }}
          NOT_SIGNED: ${{ inputs.not-signed-message }}
          ALL_SIGNED: ${{ inputs.all-signed-message }}
        run: |
          set -euo pipefail

          marker='<!-- cla-signatures -->'

          say() { printf '%s\n' "$*" >&2; }

          # Commits as the REST API lists them, to one line per person who wrote them:
          # «account<TAB>id<TAB>login» when GitHub tied the email to someone, «email<TAB>address<TAB>name»
          # otherwise. A Co-authored-by trailer is a claim of authorship like the author field.
          people() {
            jq -r '
              .[]
              | (if .author.id then ["account", (.author.id | tostring), .author.login]
                 else ["email", (.commit.author.email | ascii_downcase), .commit.author.name] end),
                (.commit.message
                 | [scan("(?im)^co-authored-by:[ \\t]*([^<\\n]*?)[ \\t]*<([^>\\n]+)>[ \\t]*$")]
                 | .[]
                 | ["email", (.[1] | ascii_downcase), .[0]])
              | @tsv' | sort -u
          }

          # An address GitHub hands out names its account outright; any other has to be public on one.
          resolve() {
            local kind key shown login id
            while IFS=$'\t' read -r kind key shown; do
              if [ "$kind" = account ]; then
                printf '%s\t%s\t%s\n' "$kind" "$key" "$shown"
                continue
              fi
              login="" id=""
              if [[ $key =~ ^([0-9]+)\+([^@]+)@users\.noreply\.github\.com$ ]]; then
                id=${BASH_REMATCH[1]} login=${BASH_REMATCH[2]}
              elif [[ $key =~ ^([^@+]+)@users\.noreply\.github\.com$ ]]; then
                login=${BASH_REMATCH[1]}
                id=$(gh api "users/$login" --jq .id 2> /dev/null) || id=""
              else
                login=$(gh api -X GET search/users -f q="$key in:email" \
                  --jq 'if .total_count == 1 then .items[0].login else "" end' 2> /dev/null) || login=""
                if [ -n "$login" ]; then
                  id=$(gh api "users/$login" --jq .id 2> /dev/null) || id=""
                fi
              fi
              if [ -n "$id" ] && [ -n "$login" ]; then
                printf 'account\t%s\t%s\n' "$id" "$login"
              else
                printf 'email\t%s\t%s\n' "$key" "$shown"
              fi
            done | sort -u -t $'\t' -k1,2
          }

          allowed() {
            local login=$1 pattern
            local IFS=,
            for pattern in $ALLOWLIST; do
              pattern=$(printf '%s' "$pattern" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              [ -n "$pattern" ] || continue
              if [[ $pattern == *'*'* ]]; then
                pattern=${pattern//[/\\[}
                pattern=${pattern//]/\\]}
                # shellcheck disable=SC2053
                [[ $login == $pattern ]] && return 0
              elif [ "$login" = "$pattern" ]; then
                return 0
              fi
            done
            return 1
          }

          # Everyone still owing a signature. An address with no account behind it can never sign.
          unsigned() {
            local signatures=$1 kind key shown
            while IFS=$'\t' read -r kind key shown; do
              [ -n "$kind" ] || continue
              if [ "$kind" = account ]; then
                allowed "$shown" && continue
                jq -e --argjson id "$key" 'any(.signedContributors[]; .id == $id)' \
                  <<< "$signatures" > /dev/null && continue
              fi
              printf '%s\t%s\t%s\n' "$kind" "$key" "$shown"
            done
          }

          worded() {
            local owe=$1 kind key shown
            printf '%s\n%s\n\n> %s\n\nThe CLA: %s\n\nStill to sign:\n' \
              "$marker" "$NOT_SIGNED" "$SIGN_PHRASE" "$DOCUMENT_URL"
            while IFS=$'\t' read -r kind key shown; do
              if [ "$kind" = account ]; then
                printf -- '- @%s\n' "$shown"
              else
                shown=${shown//@/}
                # shellcheck disable=SC2016
                printf -- '- %s, whose address `%s` belongs to no GitHub account and so cannot sign: ' \
                  "${shown:-someone}" "$key"
                printf 'add it to an account, or take the commit or its credit line out\n'
              fi
            done <<< "$owe"
          }

          ours() {
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
              | jq -rs --arg m "$marker" 'add // []
                | map(select(.user.login == "github-actions[bot]" and (.body | startswith($m))))
                | first | .id // empty'
          }

          commented() {
            local body=$1 found
            found=$(ours)
            if [ -n "$found" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$found" -f body="$body" > /dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" > /dev/null
            fi
          }

          ledger() {
            GH_TOKEN=$SIGNATURES_TOKEN gh api \
              "repos/$SIGNATURES_REPOSITORY/contents/signatures/$PROJECT/v1/cla.json"
          }

          owing() {
            local signatures commits
            signatures=$(ledger | jq '.content | @base64d | fromjson')
            commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate | jq -s add)
            people <<< "$commits" | resolve | unsigned "$signatures"
          }

          check() {
            local owe
            owe=$(owing)
            if [ -z "$owe" ]; then
              if [ -n "$(ours)" ]; then
                commented "$(printf '%s\n%s\n' "$marker" "$ALL_SIGNED")"
              fi
              say "everyone who wrote this pull request has signed, or never has to"
              return 0
            fi
            commented "$(worded "$owe")"
            while IFS=$'\t' read -r _ _ shown; do
              printf '::error::%s has not signed the CLA\n' "$shown"
            done <<< "$owe"
            return 1
          }

          sign() {
            local said login id comment at owe attempt file sha entry next err
            said=$(jq -r .comment.body "$GITHUB_EVENT_PATH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ "$said" != "$SIGN_PHRASE" ]; then
              say "a comment, not a signature"
              return 0
            fi
            login=$(jq -r .comment.user.login "$GITHUB_EVENT_PATH")
            id=$(jq -r .comment.user.id "$GITHUB_EVENT_PATH")
            comment=$(jq -r .comment.id "$GITHUB_EVENT_PATH")
            at=$(jq -r .comment.created_at "$GITHUB_EVENT_PATH")

            owe=$(owing)
            if ! cut -f1,2 <<< "$owe" | grep -qxF "account	$id"; then
              say "@$login owes no signature on #$NUMBER"
              return 0
            fi

            entry=$(jq -n --arg name "$login" --argjson id "$id" --argjson comment "$comment" \
              --arg at "$at" --argjson repo "$(jq .repository.id "$GITHUB_EVENT_PATH")" \
              --argjson pr "$NUMBER" \
              '{name: $name, id: $id, comment_id: $comment, created_at: $at, repoId: $repo,
                pullRequestNo: $pr}')

            # Two signatures at once race on the file's sha; the one that loses reads it again.
            for attempt in 1 2 3 4 5; do
              file=$(ledger)
              sha=$(jq -r .sha <<< "$file")
              if jq -e --argjson id "$id" \
                '.content | @base64d | fromjson | any(.signedContributors[]; .id == $id)' \
                <<< "$file" > /dev/null; then
                break
              fi
              next=$(jq --argjson entry "$entry" \
                '.content | @base64d | fromjson | .signedContributors += [$entry]' <<< "$file")
              if err=$(GH_TOKEN=$SIGNATURES_TOKEN gh api -X PUT \
                "repos/$SIGNATURES_REPOSITORY/contents/signatures/$PROJECT/v1/cla.json" \
                -f message="@$login has signed the CLA in $GITHUB_REPOSITORY#$NUMBER" \
                -f content="$(printf '%s\n' "$next" | base64 | tr -d '\n')" \
                -f sha="$sha" 2>&1 > /dev/null); then
                say "@$login signed"
                break
              fi
              case $err in
                *"HTTP 409"* | *"HTTP 422"*)
                  say "the signatures moved underneath ($attempt/5)"
                  [ "$attempt" -lt 5 ] || { say "the signature could not be written"; return 1; }
                  sleep $((attempt * 2))
                  ;;
                *)
                  say "$err"
                  return 1
                  ;;
              esac
            done

            rerun
          }

          # The check that failed ran on pull_request_target, and only running it again turns it green.
          rerun() {
            local head path run state
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .head.sha)
            path=${GITHUB_WORKFLOW_REF#*/*/}
            path=${path%@*}
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request_target&head_sha=$head&per_page=100" \
              | jq -r --arg path "$path" '[.workflow_runs[] | select(.path == $path)][0].id // empty')
            if [ -z "$run" ]; then
              printf '::warning::no run of %s on %s to run again; a push to the branch checks it\n' \
                "$path" "$head"
              return 0
            fi
            for _ in $(seq 1 20); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
              [ "$state" = completed ] && break
              sleep 15
            done
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun" > /dev/null
            say "the check on ${head:0:8} runs again"
          }

          main() {
            export GH_TOKEN=$GITHUB_TOKEN
            case $GITHUB_EVENT_NAME in
              pull_request_target)
                NUMBER=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
                check
                ;;
              issue_comment)
                NUMBER=$(jq -r .issue.number "$GITHUB_EVENT_PATH")
                sign
                ;;
            esac
          }

          [ -n "${CLA_LIBRARY:-}" ] || main
